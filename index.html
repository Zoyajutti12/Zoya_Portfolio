function addSearchItemToCart(btn, itemText) {
  var qty = 1;
  var parent = btn.parentElement;
  var input = parent.querySelector('input');
  
  if (!input) {
      input = parent.previousElementSibling ? parent.previousElementSibling.querySelector('input') : null;
  }

  if (input) {
    qty = parseInt(input.value || '1');
  }

  var name = itemText.split(" Rs.")[0];
  var price = parseInt(itemText.replace(/\D/g, ''), 10);

  if (!cart[name]) cart[name] = { price: price, qty: 0 };
  cart[name].qty += qty;

  localStorage.setItem('zaiqaCart', JSON.stringify(cart));
  updateProceedBtn();
 
}
